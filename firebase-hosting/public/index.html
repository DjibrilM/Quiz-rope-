<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizRope — Verify Email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0B14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 360px; width: 100%; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p {
      color: #B8A9C9;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: block;
      background: #6C5CE7;
      color: #fff;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
    }
    .btn:active { background: #5B4BD6; }
    .error { color: #EF4444; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #3D2E4A;
      border-top-color: #6C5CE7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="icon" id="icon" style="display:none"></div>
    <h1 id="title">Verifying your email…</h1>
    <p id="message">Please wait a moment.</p>
    <a href="quizrope://verify-email" class="btn" id="btn" style="display:none">
      Open QuizRope
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');
    const apiKey  = params.get('apiKey');

    function showIcon(emoji) {
      document.getElementById('spinner').style.display = 'none';
      const el = document.getElementById('icon');
      el.textContent = emoji;
      el.style.display = 'block';
    }

    function setError(msg) {
      showIcon('❌');
      document.getElementById('title').textContent = 'Verification Failed';
      document.getElementById('message').innerHTML = '<span class="error">' + msg + '</span>';
    }

    async function verifyEmail() {
      if (mode !== 'verifyEmail' || !oobCode || !apiKey) {
        setError('Invalid or missing verification link.');
        return;
      }

      try {
        const res = await fetch(
          'https://identitytoolkit.googleapis.com/v1/accounts:update?key=' + apiKey,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oobCode: oobCode }),
          }
        );

        if (!res.ok) {
          const body = await res.json();
          const msg = body?.error?.message || '';
          if (msg === 'EXPIRED_OOB_CODE') {
            setError('This link has expired. Tap Resend in the app to get a new one.');
          } else if (msg === 'INVALID_OOB_CODE') {
            setError('This link has already been used or is invalid.');
          } else {
            setError('Verification failed. Please try again.');
          }
          return;
        }

        // Success — show UI and open the app
        showIcon('✅');
        document.getElementById('title').textContent = 'Email Verified!';
        document.getElementById('message').textContent =
          'Your email has been verified. Tap below to continue in QuizRope.';
        document.getElementById('btn').style.display = 'block';

        // Auto-open after 1.5 s (works when opened on the same device as the app)
        setTimeout(function () {
          window.location.href = 'quizrope://verify-email';
        }, 1500);

      } catch (e) {
        setError('Something went wrong. Please try again.');
      }
    }

    verifyEmail();
  </script>
</body>
</html>
